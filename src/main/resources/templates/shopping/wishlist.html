<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Yêu Thích')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row gx-lg-5">
            <div class="col-12 col-md-3 mb-5 mb-md-0">
                <div class="d-flex flex-column gap-3 sticky-top" style="top: 100px;">
                    <h4 class="text-serif text-plum mb-4">Tài Khoản</h4>
                    <a th:href="@{/account/profile}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Hồ sơ cá nhân</a>
                    <a th:href="@{/account/change-password}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Đổi mật khẩu</a>
                    <a th:href="@{/account/orders}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Đơn mua</a>
                    <a th:href="@{/account/wishlist}" class="fw-bold text-burgundy text-decoration-none border-bottom border-burgundy pb-2 d-inline-block w-100">Sản phẩm yêu thích</a>
                    <a th:href="@{/account/notifications}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Thông báo</a>
                </div>
            </div>

            <div class="col-12 col-md-9">
                <h2 class="text-serif text-plum mb-4">Sản Phẩm Yêu Thích</h2>

                <div th:if="${favoriteSuccess}" class="alert alert-success rounded-0" role="alert" th:text="${favoriteSuccess}"></div>
                <div th:if="${favoriteError}" class="alert alert-danger rounded-0" role="alert" th:text="${favoriteError}"></div>

                <div class="row g-4" th:if="${favorites != null and !favorites.isEmpty()}">
                    <div class="col-6 col-md-4" th:each="favorite : ${favorites}">
                        <div class="card border-0 rounded-0 h-100 bg-transparent group">
                            <div class="position-relative bg-ivory overflow-hidden mb-3">
                                <a th:if="${favorite.available}" th:href="@{/products/{id}(id=${favorite.productId})}">
                                    <img th:if="${favorite.imageUrl != null}"
                                         th:src="${favorite.imageUrl}"
                                         th:alt="${favorite.productName}"
                                         class="w-100 object-fit-cover hover-scale-105 transition-transform"
                                         style="aspect-ratio: 3/4;">
                                    <div th:unless="${favorite.imageUrl != null}"
                                         class="w-100 d-flex align-items-center justify-content-center text-muted"
                                         style="aspect-ratio: 3/4;">
                                        <i class="bi bi-image fs-1"></i>
                                    </div>
                                </a>
                                <div th:unless="${favorite.available}">
                                    <img th:if="${favorite.imageUrl != null}"
                                         th:src="${favorite.imageUrl}"
                                         th:alt="${favorite.productName}"
                                         class="w-100 object-fit-cover opacity-50"
                                         style="aspect-ratio: 3/4;">
                                    <div th:unless="${favorite.imageUrl != null}"
                                         class="w-100 d-flex align-items-center justify-content-center text-muted"
                                         style="aspect-ratio: 3/4;">
                                        <i class="bi bi-image fs-1"></i>
                                    </div>
                                </div>

                                <form th:action="@{/account/wishlist/{id}/remove(id=${favorite.productId})}"
                                      method="post"
                                      class="position-absolute top-0 end-0 m-2">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit"
                                            class="btn bg-white text-burgundy rounded-circle p-2 shadow-sm border-0 d-flex align-items-center justify-content-center"
                                            style="width: 36px; height: 36px;"
                                            th:aria-label="'Xóa ' + ${favorite.productName} + ' khỏi yêu thích'">
                                        <i class="bi bi-heart-fill"></i>
                                    </button>
                                </form>

                                <form th:if="${favorite.available}"
                                      th:action="@{/cart/items}"
                                      method="post"
                                      class="position-absolute bottom-0 start-0 w-100 opacity-0 group-hover-opacity-100 transition-opacity">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input type="hidden" name="productId" th:value="${favorite.productId}">
                                    <input type="hidden" name="quantity" value="1">
                                    <button type="submit" class="btn w-100 bg-burgundy text-white rounded-0 py-2 border-0 fw-medium">Thêm vào giỏ</button>
                                </form>
                            </div>

                            <div class="card-body p-0">
                                <div class="text-muted small mb-1" th:if="${favorite.shopName != null}" th:text="${favorite.shopName}"></div>
                                <a th:if="${favorite.available}"
                                   th:href="@{/products/{id}(id=${favorite.productId})}"
                                   class="text-decoration-none">
                                    <h5 class="text-plum fs-6 fw-medium mb-2 hover-burgundy transition-colors line-clamp-2" th:text="${favorite.productName}"></h5>
                                </a>
                                <h5 th:unless="${favorite.available}" class="text-muted fs-6 fw-medium mb-2 line-clamp-2" th:text="${favorite.productName}"></h5>
                                <div th:if="${favorite.currentPrice != null}"
                                     class="fw-bold text-plum"
                                     th:text="${#numbers.formatDecimal(favorite.currentPrice, 0, 'COMMA', 0, 'POINT')} + '₫'"></div>
                                <div th:unless="${favorite.available}"
                                     class="small text-danger mt-2"
                                     th:text="${favorite.unavailableReason}"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${favorites == null or favorites.isEmpty()}" class="text-center py-5">
                    <i class="bi bi-heart text-clay mb-3" style="font-size: 4rem;"></i>
                    <h4 class="text-plum fw-medium mb-2">Chưa có sản phẩm yêu thích</h4>
                    <p class="text-muted mb-4">Hãy thêm những sản phẩm bạn yêu thích để xem lại sau.</p>
                    <a th:href="@{/products}" class="btn border border-plum text-plum rounded-0 fw-medium px-4 py-2 hover-bg-plum hover-text-white transition-colors">Khám phá sản phẩm</a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
