<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Đơn mua')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
    <div class="row gx-lg-5">
        <nav class="col-12 col-md-3 mb-5 mb-md-0" aria-label="Tài khoản">
            <h4 class="text-serif text-plum mb-4">Tài khoản</h4>
            <a th:href="@{/account/profile}" class="d-block text-muted mb-3">Hồ sơ cá nhân</a>
            <a th:href="@{/account/orders}" class="d-block fw-bold text-burgundy">Đơn mua</a>
        </nav>

        <div class="col-12 col-md-9">
            <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 border-bottom pb-3 mb-4">
                <div>
                    <h1 class="text-serif text-plum mb-1">Đơn mua của bạn</h1>
                    <p class="text-muted mb-0">Theo dõi các đơn hàng bạn đã đặt.</p>
                </div>
                <span class="text-muted small" th:text="${totalElements} + ' đơn hàng'">0 đơn hàng</span>
            </div>

            <form th:action="@{/account/orders}" method="get" class="row g-2 align-items-end mb-4">
                <div class="col-12 col-sm-8 col-md-6">
                    <label for="order-status-filter" class="form-label fw-bold text-plum">Lọc theo trạng thái</label>
                    <select id="order-status-filter" name="status" class="form-select rounded-0 border-clay">
                        <option value="" th:selected="${selectedStatus == null}">Tất cả trạng thái</option>
                        <option th:each="entry : ${statusOptions.entrySet()}"
                                th:value="${entry.key}"
                                th:text="${entry.value}"
                                th:selected="${entry.key == selectedStatus}">Trạng thái</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn bg-burgundy text-white rounded-0">Lọc</button>
                </div>
            </form>

            <div th:if="${#lists.isEmpty(orders)}" class="bg-white border border-clay p-5 text-center text-muted">
                <i class="bi bi-receipt fs-2 d-block mb-3" aria-hidden="true"></i>
                Chưa có đơn hàng phù hợp.
            </div>

            <div th:each="order : ${orders}" class="bg-white border border-clay p-4 mb-3">
                <div class="d-flex flex-wrap justify-content-between gap-3 border-bottom pb-3 mb-3">
                    <div>
                        <strong class="text-plum" th:text="${order.orderCode}">ORD-...</strong>
                        <time class="text-muted small ms-2"
                              th:datetime="${order.createdAt}"
                              th:text="${orderDates[order.orderCode]}">01/01/2026 00:00</time>
                    </div>
                    <span class="fw-bold text-burgundy" th:text="${statusOptions[order.status]}">Trạng thái</span>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                    <span class="text-plum">
                        Tổng tiền:
                        <strong th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</strong>
                    </span>
                    <a th:href="@{/account/orders/detail(id=${order.orderCode})}"
                       class="btn border border-plum text-plum rounded-0 px-4">
                        Xem chi tiết
                    </a>
                </div>
            </div>

            <nav th:if="${totalPages > 1}" aria-label="Phân trang đơn mua">
                <ul class="pagination justify-content-center flex-wrap gap-2 mt-4">
                    <li class="page-item" th:classappend="${currentPage == 1} ? ' disabled'">
                        <a class="page-link rounded-0" th:href="@{/account/orders(page=${currentPage - 1},status=${selectedStatus})}">Trước</a>
                    </li>
                    <li th:each="pageNumber : ${pageNumbers}"
                        class="page-item"
                        th:classappend="${pageNumber == currentPage} ? ' active'">
                        <a class="page-link rounded-0"
                           th:href="@{/account/orders(page=${pageNumber},status=${selectedStatus})}"
                           th:text="${pageNumber}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages} ? ' disabled'">
                        <a class="page-link rounded-0" th:href="@{/account/orders(page=${currentPage + 1},status=${selectedStatus})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
