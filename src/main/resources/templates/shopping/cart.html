<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Giỏ hàng')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="w-100 bg-white py-5">
    <div class="container max-w-1440">
        <div class="d-flex justify-content-between align-items-center border-bottom border-clay pb-3 mb-4">
            <h1 class="fw-bold text-plum mb-0">Giỏ hàng của bạn</h1>
            <span class="text-muted" th:text="${cart.totalQuantity} + ' sản phẩm'">0 sản phẩm</span>
        </div>

        <div th:if="${cartSuccess}" class="alert alert-success rounded-0" th:text="${cartSuccess}"></div>
        <div th:if="${cartWarning}" class="alert alert-warning rounded-0" th:text="${cartWarning}"></div>
        <div th:if="${cartError}" class="alert alert-danger rounded-0" th:text="${cartError}"></div>
        <div th:if="${!cart.empty && cart.totalQuantity == 0}" class="alert alert-warning rounded-0">
            Một hoặc nhiều sản phẩm trong giỏ hiện không còn khả dụng. Vui lòng kiểm tra cảnh báo trước khi thanh toán.
        </div>

        <div th:if="${cart.empty}" class="text-center py-5 bg-ivory border border-clay">
            <i class="bi bi-cart-x text-clay d-block mb-3" style="font-size: 3rem;"></i>
            <p class="text-muted mb-0">Giỏ hàng đang trống.</p>
        </div>

        <div th:if="${!cart.empty}" class="row g-4">
            <div class="col-lg-8">
                <section th:each="shop : ${cart.shops}" class="mb-4 border border-clay">
                    <div class="bg-ivory px-3 py-2 fw-bold text-plum" th:text="${shop.shopName}">Shop</div>
                    <div th:each="item : ${shop.items}" class="p-3 border-top border-clay">
                        <div class="d-flex gap-3 align-items-center">
                            <img th:if="${item.imageUrl != null}" th:src="${item.imageUrl}" th:alt="${item.productName}"
                                 class="bg-ivory object-fit-cover" style="width: 72px; height: 90px;">
                            <div class="flex-grow-1">
                                <div class="fw-medium text-plum" th:text="${item.productName}">Product</div>
                                <div th:if="${item.available}" class="text-burgundy small">
                                    <span th:text="${#numbers.formatDecimal(item.currentPrice, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</span>
                                    <span class="text-muted ms-2" th:text="'Còn ' + ${item.stockQuantity} + ' sản phẩm'">Còn 1 sản phẩm</span>
                                    <form th:action="@{/cart/items/{productId}/quantity(productId=${item.productId})}"
                                          method="post" class="d-flex align-items-center gap-2 mt-2">
                                        <label th:for="'quantity-' + ${item.productId}" class="visually-hidden">Số lượng</label>
                                        <input type="number" name="quantity"
                                               th:id="'quantity-' + ${item.productId}"
                                               min="1" th:max="${item.stockQuantity}" th:value="${item.quantity}"
                                               class="form-control form-control-sm rounded-0" style="max-width: 90px;" required>
                                        <button type="submit" class="btn btn-sm btn-outline-secondary rounded-0">Cập nhật</button>
                                    </form>
                                </div>
                                <div th:unless="${item.available}" class="text-danger small" th:text="${item.availabilityMessage}">Không khả dụng</div>
                                <form th:if="${!item.available && item.quantityAdjustable}"
                                      th:action="@{/cart/items/{productId}/quantity(productId=${item.productId})}"
                                      method="post" class="d-flex align-items-center gap-2 mt-2">
                                    <label th:for="'quantity-' + ${item.productId}" class="small text-muted"
                                           th:text="'Còn ' + ${item.stockQuantity} + ' sản phẩm'">Tồn kho</label>
                                    <input type="number" name="quantity"
                                           th:id="'quantity-' + ${item.productId}"
                                           min="1" th:max="${item.stockQuantity}" th:value="${item.stockQuantity}"
                                           class="form-control form-control-sm rounded-0" style="max-width: 90px;" required>
                                    <button type="submit" class="btn btn-sm btn-outline-secondary rounded-0">Điều chỉnh</button>
                                </form>
                            </div>
                            <div th:if="${item.available}" class="fw-bold text-burgundy"
                                 th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</div>
                        </div>
                    </div>
                </section>
            </div>
            <aside class="col-lg-4">
                <div class="bg-ivory border border-clay p-4">
                    <h2 class="h5 fw-bold text-plum border-bottom border-clay pb-3">Tạm tính</h2>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted">Tổng cộng</span>
                        <span class="fw-bold text-burgundy fs-5"
                              th:text="${#numbers.formatDecimal(cart.subtotal, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</span>
                    </div>
                    <button type="button" class="btn btn-secondary rounded-0 w-100 mt-4" disabled>Tiến hành thanh toán</button>
                    <p class="text-muted small mt-3 mb-0">Giá được đọc lại từ sản phẩm hiện tại.</p>
                </div>
            </aside>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
