<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Chi tiết sản phẩm')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="w-100 bg-white py-5">
        <div class="max-w-1440 mx-auto px-3 px-md-4">
            <div class="text-uppercase fw-medium mb-4 text-muted small">
                <a th:href="@{/}" class="text-decoration-none text-muted hover-burgundy transition-colors">Trang chủ</a>
                /
                <a th:href="@{/products}" class="text-decoration-none text-muted hover-burgundy transition-colors">Sản phẩm</a>
                /
                <span th:text="${product.name}">Sản phẩm</span>
            </div>

            <div class="row gx-lg-5 mb-5">
                <div class="col-12 col-md-6 mb-4 mb-md-0">
                    <div class="position-relative bg-ivory mb-3 border border-clay">
                        <img th:src="${product.thumbnailUrl}"
                             th:alt="${product.name}"
                             class="w-100 h-100 object-fit-cover"
                             style="aspect-ratio: 4/5;" />
                    </div>
                    <div class="d-flex gap-3 overflow-x-auto hide-scrollbar">
                        <img th:each="image, imageStat : ${product.images}"
                             th:src="${image.imageUrl}"
                             th:alt="${product.name + ' - ảnh ' + (imageStat.index + 1)}"
                             th:class="${imageStat.index == 0} ? 'bg-ivory border border-clay cursor-pointer' : 'bg-ivory border border-clay cursor-pointer opacity-50 hover-opacity transition-colors'"
                             style="width: 80px; height: 80px; object-fit: cover;">
                    </div>
                </div>

                <div class="col-12 col-md-6 d-flex flex-column">
                    <div class="mb-3 d-flex justify-content-between align-items-center">
                        <div class="fw-bold text-uppercase text-muted" th:text="${product.shopName}">SHOP</div>
                        <span class="text-muted small" th:text="${product.categoryName}">Danh mục</span>
                    </div>
                    <h1 class="fw-bold text-plum mb-3" style="font-size: 2.5rem;" th:text="${product.name}">Sản phẩm</h1>
                    <div class="fw-bold text-burgundy mb-4" style="font-size: 1.5rem;"
                         th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</div>

                    <p class="text-muted mb-4 pb-4 border-bottom border-clay" style="line-height: 1.8;"
                       th:text="${product.description}">Mô tả sản phẩm</p>

                    <div class="mb-4">
                        <span class="badge bg-success rounded-0 px-3 py-2 fs-6"
                              th:text="'Còn hàng (' + ${product.stock} + ' sản phẩm)'">Còn hàng</span>
                    </div>

                    <div class="mb-4 d-flex align-items-center gap-3 bg-ivory p-3 border border-clay">
                        <div th:if="${product.shop.logoUrl != null}"
                             class="bg-white border border-clay p-1 flex-shrink-0"
                             style="width: 50px; height: 50px;">
                            <img th:src="${product.shop.logoUrl}" th:alt="${product.shop.name}"
                                 class="w-100 h-100 object-fit-cover">
                        </div>
                        <div th:unless="${product.shop.logoUrl != null}"
                             class="rounded-circle bg-white border border-clay d-flex align-items-center justify-content-center flex-shrink-0"
                             style="width: 50px; height: 50px;">
                            <i class="bi bi-shop text-plum fs-4"></i>
                        </div>
                        <div>
                            <div class="fw-bold text-plum" th:text="${product.shop.name}">Shop</div>
                            <div class="text-muted small" th:text="${product.shop.address}">Địa chỉ shop</div>
                        </div>
                        <a th:href="@{/merchant/shop-public(shopId=${product.shopId})}"
                           class="btn border border-plum text-plum hover-bg-plum hover-text-white rounded-0 px-3 py-1 ms-auto transition-colors small">
                            Xem shop
                        </a>
                    </div>

                    <div class="mb-4">
                        <div class="fw-bold text-plum mb-2">Số lượng</div>
                        <div class="d-flex align-items-center border border-clay" style="width: 120px; height: 45px;">
                            <button type="button" class="btn border-0 shadow-none text-plum d-flex align-items-center justify-content-center h-100" style="width: 40px;" disabled>
                                <i class="bi bi-dash"></i>
                            </button>
                            <span class="fw-bold text-plum d-flex align-items-center justify-content-center border-start border-end border-clay h-100 flex-grow-1">1</span>
                            <button type="button" class="btn border-0 shadow-none text-plum d-flex align-items-center justify-content-center h-100" style="width: 40px;" disabled>
                                <i class="bi bi-plus"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex gap-3 mt-auto">
                        <form th:if="${role == 'USER'}" th:action="@{/account/wishlist/{id}(id=${product.id})}" method="post" class="flex-shrink-0">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="senvia-btn senvia-btn-outline d-flex align-items-center justify-content-center" style="width: 50px;" aria-label="Thêm sản phẩm vào yêu thích">
                                <i class="bi bi-heart"></i>
                            </button>
                        </form>
                        <a th:unless="${role == 'USER'}" th:href="@{/login}"
                           class="senvia-btn senvia-btn-outline flex-shrink-0 d-flex align-items-center justify-content-center text-decoration-none"
                           style="width: 50px;" aria-label="Đăng nhập để thêm sản phẩm vào yêu thích">
                            <i class="bi bi-heart"></i>
                        </a>
                        <form th:if="${role == 'USER'}" th:action="@{/cart/items}" method="post" class="flex-grow-1">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <input type="hidden" name="quantity" value="1">
                            <button type="submit" class="senvia-btn senvia-btn-primary w-100 d-flex justify-content-center align-items-center border-0">
                                Thêm vào giỏ hàng
                            </button>
                        </form>
                        <a th:unless="${role == 'USER'}" th:href="@{/login}"
                           class="senvia-btn senvia-btn-primary w-100 d-flex justify-content-center align-items-center text-decoration-none">
                            Đăng nhập để mua
                        </a>
                    </div>
                </div>
            </div>

            <div class="mt-5 pt-5 border-top border-clay">
                <h3 class="fw-bold text-plum mb-4">Thông tin sản phẩm</h3>
                <div class="bg-ivory border border-clay p-4">
                    <div class="d-flex justify-content-between border-bottom border-clay py-2">
                        <span class="text-muted">Danh mục</span>
                        <span class="text-plum fw-medium" th:text="${product.categoryName}">Danh mục</span>
                    </div>
                    <div class="d-flex justify-content-between py-2">
                        <span class="text-muted">Gian hàng</span>
                        <span class="text-plum fw-medium" th:text="${product.shopName}">Shop</span>
                    </div>
                </div>
            </div>

            <div class="mt-5 pt-5 border-top border-clay">
                <h3 class="fw-bold text-plum mb-4 text-center">Có thể bạn cũng thích</h3>
                <div class="row g-3 g-md-4">
                    <div class="col-6 col-md-3" th:each="related : ${relatedProducts}">
                        <div th:replace="~{fragments/product-card :: product-card(${related})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
