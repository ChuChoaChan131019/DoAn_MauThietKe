<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Tất cả sản phẩm')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="w-100 bg-white py-5">
        <div class="max-w-1440 mx-auto px-3 px-md-4">

            <!-- Top Bar with Search Mockup -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-end mb-5 border-bottom pb-4 products-top-bar">
                <div>
                    <div class="text-uppercase fw-medium mb-3 text-muted products-breadcrumb">Trang chủ / Sản phẩm</div>
                    <h1 class="fw-bold text-plum m-0 products-title">Tất cả sản phẩm <span class="fw-normal text-muted ms-2 products-count" th:text="'(' + ${totalItems} + ')'">(128)</span></h1>
                </div>

                <div class="mt-4 mt-md-0 d-flex flex-wrap gap-2 align-items-center">
                    <!-- Search Input Mockup -->
                    <form th:action="@{/products}" method="get" class="d-flex m-0 flex-grow-1" style="min-width: 0;">
                        <input type="text" name="q" class="form-control rounded-0 border-clay shadow-none" placeholder="Tìm kiếm..." th:value="${param.q}" style="min-width: 0;">
                        <input type="hidden" name="category" th:if="${param.category}" th:value="${param.category}">
                        <input type="hidden" name="sort" th:if="${param.sort}" th:value="${param.sort}">
                        <input type="hidden" name="min" th:if="${param.min}" th:value="${param.min}">
                        <input type="hidden" name="max" th:if="${param.max}" th:value="${param.max}">
                        <th:block th:each="shopName : ${selectedShops}"><input type="hidden" name="shop" th:value="${shopName}"></th:block>
                        <button type="submit" class="btn border border-clay bg-ivory text-plum rounded-0 hover-burgundy transition-colors flex-shrink-0"><i class="bi bi-search"></i></button>
                    </form>

                    <form id="sortForm" th:action="@{/products}" method="get" class="m-0">
                        <input type="hidden" name="q" th:if="${param.q}" th:value="${param.q}">
                        <input type="hidden" name="category" th:if="${param.category}" th:value="${param.category}">
                        <input type="hidden" name="min" th:if="${param.min}" th:value="${param.min}">
                        <input type="hidden" name="max" th:if="${param.max}" th:value="${param.max}">
                        <th:block th:each="shopName : ${selectedShops}"><input type="hidden" name="shop" th:value="${shopName}"></th:block>
                        <select name="sort" onchange="this.form.submit()" class="form-select bg-white text-plum fw-bold rounded-0 shadow-none products-sort" style="max-width: 100%; font-size: 0.875rem;">
                            <option value="newest" th:selected="${sort == 'newest'}">Mới nhất</option>
                            <option value="price_asc" th:selected="${sort == 'price_asc'}">Giá: Thấp → Cao</option>
                            <option value="price_desc" th:selected="${sort == 'price_desc'}">Giá: Cao → Thấp</option>
                        </select>
                    </form>
                </div>
            </div>

            <div class="row gx-lg-5">

                <!-- LEFT FILTER - 240px -->
                <aside class="col-12 col-lg-3 col-xl-2 mb-5 mb-lg-0">
                    <div class="d-flex flex-column gap-5 sticky-top products-sidebar">

                        <div>
                            <h3 class="fw-bold text-plum mb-4 products-sidebar-title">Danh mục</h3>
                            <ul class="list-unstyled d-flex flex-column gap-3 text-plum products-sidebar-list">
                                <li><a th:href="@{/products(q=${param.q}, sort=${param.sort}, min=${param.min}, max=${param.max}, shop=${selectedShops})}" class="text-decoration-none text-burgundy fw-bold cursor-pointer py-1 d-block">Tất cả sản phẩm</a></li>
                                <li th:each="availableCategory : ${categories}">
                                    <a th:href="@{/products(category=${availableCategory.name}, q=${param.q}, sort=${param.sort}, min=${param.min}, max=${param.max}, shop=${selectedShops})}"
                                       th:text="${availableCategory.name}"
                                       class="text-decoration-none text-plum hover-burgundy transition-colors cursor-pointer py-1 d-block"></a>
                                </li>
                            </ul>
                        </div>

                        <!-- Price Filter Mockup -->
                        <div class="border-top pt-4 products-sidebar-divider">
                            <h3 class="fw-bold text-plum mb-4 products-sidebar-title">Khoảng giá</h3>
                            <form th:action="@{/products}" method="get" class="d-flex flex-column gap-2">
                                <input type="hidden" name="q" th:if="${param.q}" th:value="${param.q}">
                                <input type="hidden" name="category" th:if="${param.category}" th:value="${param.category}">
                                <input type="hidden" name="sort" th:if="${param.sort}" th:value="${param.sort}">
                                <th:block th:each="shopName : ${selectedShops}"><input type="hidden" name="shop" th:value="${shopName}"></th:block>
                                <div class="d-flex align-items-center gap-2">
                                    <input type="number" name="min" class="form-control rounded-0 border-clay text-plum" placeholder="Từ" style="width: 80px;" th:value="${param.min}">
                                    <span class="text-muted">-</span>
                                    <input type="number" name="max" class="form-control rounded-0 border-clay text-plum" placeholder="Đến" style="width: 80px;" th:value="${param.max}">
                                </div>
                                <button type="submit" class="btn border border-plum text-plum w-100 rounded-0 hover-bg-plum hover-text-white transition-colors mt-2">Áp dụng</button>
                            </form>
                        </div>

                        <div class="border-top pt-4 products-sidebar-divider">
                            <h3 class="fw-bold text-plum mb-4 products-sidebar-title">Gian hàng</h3>
                            <form th:action="@{/products}" method="get">
                                <input type="hidden" name="q" th:if="${param.q}" th:value="${param.q}">
                                <input type="hidden" name="category" th:if="${param.category}" th:value="${param.category}">
                                <input type="hidden" name="sort" th:if="${param.sort}" th:value="${param.sort}">
                                <input type="hidden" name="min" th:if="${param.min}" th:value="${param.min}">
                                <input type="hidden" name="max" th:if="${param.max}" th:value="${param.max}">
                                <ul class="list-unstyled d-flex flex-column gap-3 text-plum products-sidebar-list">
                                    <li th:each="shopEntry : ${shopCounts}"
                                        class="hover-burgundy transition-colors cursor-pointer d-flex justify-content-between align-items-center">
                                        <div class="form-check m-0 d-flex align-items-center gap-2">
                                            <input type="checkbox" name="shop" th:value="${shopEntry.key}"
                                                   th:checked="${selectedShops.contains(shopEntry.key)}"
                                                   onchange="this.form.submit()"
                                                   class="form-check-input m-0 rounded-0 products-filter-checkbox" />
                                            <label class="form-check-label products-filter-label" th:text="${shopEntry.key}">Shop</label>
                                        </div>
                                        <span class="text-muted products-filter-count"
                                              th:text="'(' + ${shopEntry.value} + ')'">(0)</span>
                                    </li>
                                </ul>
                            </form>
                        </div>

                    </div>
                </aside>

                <!-- RIGHT GRID -->
                <div class="col-12 col-lg-9 col-xl-10">
                    <!-- Empty State Mockup -->
                    <div th:if="${products.isEmpty()}" class="text-center py-5 my-5">
                        <i class="bi bi-search text-clay d-block mb-3" style="font-size: 3rem;"></i>
                        <h4 class="text-plum">Không tìm thấy sản phẩm nào</h4>
                        <p class="text-muted">Thử thay đổi bộ lọc hoặc từ khóa tìm kiếm của bạn.</p>
                        <a th:href="@{/products}" class="btn bg-burgundy text-white rounded-0 px-4 py-2 hover-bg-plum mt-3">Xóa bộ lọc</a>
                    </div>

                    <div th:unless="${products.isEmpty()}">
                        <div class="row g-3 g-md-4">
                            <!-- Loop replacing /products/1 with /products/ dynamically -->
                            <div class="col-6 col-md-4 col-xl-3" th:each="product : ${products}">
                                <div th:replace="~{fragments/product-card :: product-card(${product})}"></div>
                            </div>
                        </div>

                        <!-- Pagination -->
                        <div th:if="${totalPages > 1}" class="d-flex justify-content-center mt-5 pt-5 border-top products-pagination-container">
                            <div class="d-flex gap-2">
                                <a th:if="${currentPage > 1}" th:href="@{/products(page=${currentPage - 1}, q=${param.q}, category=${param.category}, sort=${sort}, min=${param.min}, max=${param.max}, shop=${selectedShops})}" class="btn border border-clay text-plum hover-burgundy hover-border-burgundy rounded-0 d-flex align-items-center justify-content-center p-0 transition-colors products-page-btn text-decoration-none">&larr;</a>

                                <a th:each="i : ${#numbers.sequence(1, totalPages)}"
                                   th:href="@{/products(page=${i}, q=${param.q}, category=${param.category}, sort=${sort}, min=${param.min}, max=${param.max}, shop=${selectedShops})}"
                                   th:text="${i}"
                                   th:class="${i == currentPage} ? 'btn border-0 text-white rounded-0 d-flex align-items-center justify-content-center p-0 fw-bold products-page-btn-active text-decoration-none' : 'btn border border-clay text-plum hover-burgundy hover-border-burgundy rounded-0 d-flex align-items-center justify-content-center p-0 transition-colors products-page-btn text-decoration-none'"
                                   th:style="${i == currentPage} ? 'background-color: var(--color-burgundy);' : ''">1</a>

                                <a th:if="${currentPage < totalPages}" th:href="@{/products(page=${currentPage + 1}, q=${param.q}, category=${param.category}, sort=${sort}, min=${param.min}, max=${param.max}, shop=${selectedShops})}" class="btn border border-clay text-plum hover-burgundy hover-border-burgundy rounded-0 d-flex align-items-center justify-content-center p-0 transition-colors products-page-btn text-decoration-none">&rarr;</a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
