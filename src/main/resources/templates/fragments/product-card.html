<div th:fragment="product-card(product)" class="group d-flex flex-column w-100 h-100 position-relative">
    <a th:href="@{/products/{id}(id=${product.id})}" class="d-block position-relative bg-ivory overflow-hidden mb-3 text-decoration-none pc-img-container">
        <img th:src="${product.image}" th:alt="${product.name}" class="w-100 h-100 object-fit-cover p-2 p-md-3 group-hover-scale-105 transition-transform" />
        
        <!-- Badges -->
        <div class="position-absolute d-flex flex-column gap-1 pc-badge-container">
            <span th:if="${product.isNew}" class="bg-white text-plum fw-bold text-uppercase px-2 py-1 shadow-sm pc-badge">Mới</span>
            <span th:if="${product.discount > 0}" th:text="'-' + ${product.discount} + '%'" class="bg-burgundy text-white fw-bold text-uppercase px-2 py-1 shadow-sm pc-badge"></span>
        </div>

    </a>

    <!-- Hover Action -->
    <div class="position-absolute start-0 end-0 mx-2 text-center shadow-sm product-card-action pc-action-container">
        <form th:if="${role == 'USER'}" th:action="@{/cart/items}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="productId" th:value="${product.id}">
            <input type="hidden" name="quantity" value="1">
            <button type="submit" class="btn w-100 text-burgundy fw-bold text-uppercase hover-burgundy transition-colors py-2 border-0 shadow-none pc-action-btn">
                Thêm nhanh
            </button>
        </form>
        <a th:unless="${role == 'USER'}" th:href="@{/login}" class="btn w-100 text-burgundy fw-bold text-uppercase hover-burgundy transition-colors py-2 border-0 shadow-none pc-action-btn">
            Đăng nhập để thêm
        </a>
    </div>

    <form th:if="${role == 'USER'}"
          th:action="@{/account/wishlist/{id}(id=${product.id})}"
          method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit"
                class="btn position-absolute text-muted hover-burgundy product-card-heart bg-white p-1 rounded-circle border-0 shadow-none d-flex align-items-center justify-content-center pc-heart-btn"
                aria-label="Thêm sản phẩm vào yêu thích">
            <i class="bi bi-heart pc-heart-icon"></i>
        </button>
    </form>
    <a th:unless="${role == 'USER'}"
       th:href="@{/login}"
       class="btn position-absolute text-muted hover-burgundy product-card-heart bg-white p-1 rounded-circle border-0 shadow-none d-flex align-items-center justify-content-center pc-heart-btn"
       aria-label="Đăng nhập để thêm sản phẩm vào yêu thích">
        <i class="bi bi-heart pc-heart-icon"></i>
    </a>

    <div class="d-flex flex-column text-start">
        <span class="text-uppercase text-muted fw-medium mb-1 pc-brand" th:text="${product.brand}">BRAND</span>
        <a th:href="@{/products/{id}(id=${product.id})}" class="text-plum fw-medium text-truncate w-100 text-decoration-none group-hover-burgundy transition-colors mb-1 pc-name" th:text="${product.name}">
            Product Name
        </a>
        <div class="d-flex align-items-center gap-2">
            <span class="fw-bold text-burgundy pc-price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + '₫'"></span>
            <span th:if="${product.oldPrice != null}" class="text-muted text-decoration-line-through pc-old-price" th:text="${#numbers.formatDecimal(product.oldPrice, 0, 'COMMA', 0, 'POINT')} + '₫'"></span>
        </div>
    </div>
</div>
