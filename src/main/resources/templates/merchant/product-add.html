<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Thêm sản phẩm')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="w-100 mx-auto px-3 px-md-4 py-5" style="max-width: 1100px;">
    <a th:href="@{/merchant/products}" class="text-muted text-decoration-none">← Quay lại sản phẩm</a>
    <h2 class="text-serif text-plum my-4">Thêm sản phẩm mới</h2>

    <form th:action="@{/merchant/products}" th:object="${productForm}" method="post" enctype="multipart/form-data" class="bg-white p-4 border border-clay shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label for="productName" class="form-label">Tên sản phẩm</label>
            <input id="productName" type="text" th:field="*{name}" class="form-control" maxlength="200" required>
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-1"></div>
        </div>
        <div class="mb-3">
            <label for="productDescription" class="form-label">Mô tả</label>
            <textarea id="productDescription" th:field="*{description}" class="form-control" rows="4"></textarea>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="productCategory" class="form-label">Danh mục</label>
                <select id="productCategory" th:field="*{categoryId}" class="form-select" required>
                    <option value="">Chọn danh mục đang hoạt động</option>
                    <option th:each="category : ${categoryOptions}" th:value="${category.id}" th:text="${category.name}"></option>
                </select>
                <div th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-3">
                <label for="productPrice" class="form-label">Giá bán</label>
                <input id="productPrice" type="number" step="0.01" min="0.01" th:field="*{price}" class="form-control" required>
                <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-3">
                <label for="productStock" class="form-label">Tồn kho</label>
                <input id="productStock" type="number" min="0" th:field="*{stockQuantity}" class="form-control" required>
                <div th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}" class="text-danger small mt-1"></div>
            </div>
        </div>
        <div class="mb-3">
            <label for="productImages" class="form-label">Ảnh sản phẩm</label>
            <input id="productImages" type="file" name="images" class="form-control"
                   accept="image/jpeg,image/png" multiple required>
            <div th:if="${#fields.hasErrors('images')}" th:errors="*{images}" class="text-danger small mt-1"></div>
            <div class="form-text">Tối đa 5 ảnh, mỗi ảnh không quá 2MB. Chỉ nhận JPEG hoặc PNG.</div>
        </div>
        <button type="submit" class="btn bg-burgundy text-white rounded-0">Lưu sản phẩm</button>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
