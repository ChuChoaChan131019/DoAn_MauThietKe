<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Gian hàng')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="w-100 bg-white">
        <section class="w-100 position-relative bg-plum" style="min-height: 220px;">
            <div class="max-w-1440 mx-auto px-3 px-md-4 py-5">
                <div class="d-flex align-items-center gap-4">
                    <div th:if="${shop.logoUrl != null}"
                         class="bg-white p-1 shadow-sm border border-clay flex-shrink-0"
                         style="width: 120px; height: 120px;">
                        <img th:src="${shop.logoUrl}" th:alt="${shop.name}"
                             class="w-100 h-100 object-fit-cover bg-ivory" />
                    </div>
                    <div th:unless="${shop.logoUrl != null}"
                         class="bg-white p-1 shadow-sm border border-clay d-flex align-items-center justify-content-center flex-shrink-0"
                         style="width: 120px; height: 120px;">
                        <i class="bi bi-shop text-plum" style="font-size: 3rem;"></i>
                    </div>
                    <div class="text-white">
                        <h1 class="text-serif fw-bold mb-2" th:text="${shop.name}">Gian hàng</h1>
                        <p class="mb-0" th:text="${shop.description}">Thông tin gian hàng</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="max-w-1440 mx-auto px-3 px-md-4 py-4 border-bottom border-clay mb-5">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3">
                <div>
                    <h2 class="fw-bold text-plum mb-2" th:text="${shop.name}">Gian hàng</h2>
                    <p class="text-muted m-0" th:if="${shop.address != null}" th:text="${shop.address}">Địa chỉ shop</p>
                </div>
                <a th:href="@{/products}" class="btn border border-plum text-plum rounded-0 fw-medium px-4 hover-bg-plum hover-text-white transition-colors align-self-start">
                    Xem toàn bộ sản phẩm
                </a>
            </div>
        </section>

        <section class="max-w-1440 mx-auto px-3 px-md-4 pb-5">
            <h3 class="fw-bold text-plum mb-4">Sản phẩm đang bán</h3>

            <div th:if="${products.isEmpty()}" class="text-center py-5 bg-ivory border border-clay">
                <i class="bi bi-box-seam text-muted mb-3 d-block" style="font-size: 2rem;"></i>
                <p class="text-muted mb-0">Gian hàng hiện chưa có sản phẩm đang bán.</p>
            </div>

            <div th:unless="${products.isEmpty()}" class="row g-4">
                <div class="col-6 col-md-4 col-lg-3" th:each="product : ${products}">
                    <div th:replace="~{fragments/product-card :: product-card(${product})}"></div>
                </div>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
