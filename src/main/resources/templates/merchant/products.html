<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Quản lý sản phẩm')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="w-100 mx-auto px-3 px-md-4 py-5" style="max-width: 1440px;">
    <div class="row gx-lg-5">
        <aside class="col-12 col-md-3 mb-5 mb-md-0">
            <div class="d-flex flex-column gap-3 sticky-top" style="top: 100px;">
                <h4 class="text-serif text-plum mb-4">Kênh Người Bán</h4>
                <a th:href="@{/merchant/dashboard}" class="text-muted text-decoration-none pb-2 d-inline-block w-100">Thống kê</a>
                <a th:href="@{/merchant/products}" class="fw-bold text-burgundy text-decoration-none border-bottom border-burgundy pb-2 d-inline-block w-100">Quản lý sản phẩm</a>
                <a th:href="@{/merchant/profile}" class="text-muted text-decoration-none pb-2 d-inline-block w-100">Thông tin gian hàng</a>
            </div>
        </aside>

        <section class="col-12 col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-4 gap-3">
                <h2 class="text-serif text-plum m-0">Sản phẩm của bạn</h2>
                <a th:href="@{/merchant/products/add}" class="btn bg-burgundy text-white rounded-0">Thêm sản phẩm</a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(products)}" class="p-4 text-muted">Chưa có sản phẩm nào.</div>
                    <div th:unless="${#lists.isEmpty(products)}" class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                            <tr>
                                <th class="px-4 py-3">Sản phẩm</th>
                                <th class="py-3">Danh mục</th>
                                <th class="py-3">Giá</th>
                                <th class="py-3">Tồn kho</th>
                                <th class="py-3">Trạng thái</th>
                                <th class="py-3 text-end px-4">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="product : ${products}">
                                <td class="px-4">
                                    <div class="fw-semibold text-plum" th:text="${product.name}"></div>
                                    <div class="text-muted small" th:text="${product.description ?: 'Không có mô tả'}"></div>
                                </td>
                                <td>
                                    <span th:text="${product.categoryName}"></span>
                                    <span th:if="${!product.categoryActive}" class="badge text-bg-secondary ms-1">Đã ẩn</span>
                                </td>
                                <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + '₫'"></td>
                                <td th:text="${product.stockQuantity}"></td>
                                <td>
                                    <span th:if="${product.active}" class="badge text-bg-success">Đang bán</span>
                                    <span th:unless="${product.active}" class="badge text-bg-secondary">Đã ẩn</span>
                                </td>
                                <td class="text-end px-4">
                                    <a th:href="@{/merchant/products/{id}/edit(id=${product.id})}" class="btn btn-sm btn-outline-secondary rounded-0">Sửa</a>
                                    <form th:if="${product.active}" th:action="@{/merchant/products/{id}/hide(id=${product.id})}" method="post" class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger rounded-0" onclick="return confirm('Bạn có chắc muốn ẩn sản phẩm này không?');">Ẩn</button>
                                    </form>
                                    <form th:unless="${product.active}" th:action="@{/merchant/products/{id}/show(id=${product.id})}" method="post" class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-sm btn-outline-success rounded-0">Bỏ ẩn</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
