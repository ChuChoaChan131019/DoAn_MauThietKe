<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Sửa sản phẩm')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="w-100 mx-auto px-3 px-md-4 py-5" style="max-width: 1100px;">
    <a th:href="@{/merchant/products}" class="text-muted text-decoration-none">← Quay lại sản phẩm</a>
    <h2 class="text-serif text-plum my-4">Sửa sản phẩm</h2>

    <form th:action="@{/merchant/products/{id}(id=${product.id})}" th:object="${productForm}" method="post" enctype="multipart/form-data" class="bg-white p-4 border border-clay shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label for="productName" class="form-label">Tên sản phẩm</label>
            <input id="productName" type="text" th:field="*{name}" class="form-control" maxlength="200" required>
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-1"></div>
        </div>
        <div class="mb-3">
            <label for="productDescription" class="form-label">Mô tả</label>
            <textarea id="productDescription" th:field="*{description}" class="form-control" rows="4" required></textarea>
            <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger small mt-1"></div>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="productCategory" class="form-label">Danh mục</label>
                <select id="productCategory" th:field="*{categoryId}" class="form-select" required>
                    <option th:if="${!product.categoryActive}" th:value="${product.categoryId}" th:text="${product.categoryName + ' (đã ẩn - cần chuyển)'}" disabled></option>
                    <option th:each="category : ${categoryOptions}" th:value="${category.id}" th:text="${category.name}"></option>
                </select>
                <div th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-3">
                <label for="productPrice" class="form-label">Giá bán</label>
                <input id="productPrice" type="number" step="0.01" min="0.01" th:field="*{price}" class="form-control" required>
                <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-3">
                <label for="productStock" class="form-label">Tồn kho</label>
                <input id="productStock" type="number" min="0" th:field="*{stockQuantity}" class="form-control" required>
                <div th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}" class="text-danger small mt-1"></div>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Ảnh hiện tại</label>
            <div th:if="${#lists.isEmpty(product.images)}" class="text-muted small">Sản phẩm chưa có ảnh.</div>
            <div th:unless="${#lists.isEmpty(product.images)}" class="row g-3">
                <div th:each="image : ${product.images}" class="col-6 col-md-3">
                    <img th:src="${image.imageUrl}" alt="Ảnh sản phẩm" class="img-fluid border border-clay rounded">
                    <label class="form-check mt-2 small">
                        <input class="form-check-input" type="checkbox" name="removedImageIds" th:value="${image.id}">
                        <span class="form-check-label">Xóa ảnh này</span>
                    </label>
                </div>
            </div>
        </div>
        <div class="mb-3">
            <label for="productImages" class="form-label">Thêm ảnh mới</label>
            <input id="productImages" type="file" name="images" class="form-control"
                   accept="image/jpeg,image/png" multiple>
            <div th:if="${#fields.hasErrors('images')}" th:errors="*{images}" class="text-danger small mt-1"></div>
            <div class="form-text">Tối đa 5 ảnh cho một sản phẩm, mỗi ảnh không quá 2MB.</div>
        </div>
        <button type="submit" class="btn bg-burgundy text-white rounded-0">Cập nhật sản phẩm</button>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
