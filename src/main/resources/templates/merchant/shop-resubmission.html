<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Cập Nhật Yêu Cầu Gian Hàng')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="text-center mb-5">
                    <h2 class="text-serif text-plum mb-3">Cập Nhật Và Gửi Lại Yêu Cầu</h2>
                    <p class="text-muted">Vui lòng chỉnh sửa thông tin theo góp ý của quản trị viên trước khi gửi lại.</p>
                </div>

                <div class="alert alert-danger border-0 rounded-0 mb-4" role="alert">
                    <h6 class="fw-bold mb-2">Lý do từ chối:</h6>
                    <p class="mb-0" th:text="${ownedShop.rejectionReason}">Yêu cầu cần được cập nhật.</p>
                </div>

                <form th:action="@{/merchant/shop-resubmission}"
                      th:object="${shopResubmissionForm}" method="post"
                      enctype="multipart/form-data"
                      class="bg-white p-4 p-md-5 border border-clay shadow-sm">
                    <div th:if="${resubmissionError}" class="alert alert-danger border-0 rounded-0" role="alert"
                         th:text="${resubmissionError}"></div>

                    <h4 class="fw-bold text-plum mb-4 pb-2 border-bottom">Thông tin gian hàng</h4>

                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Tên gian hàng *</label>
                        <input th:field="*{shopName}" type="text"
                               class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum"
                               placeholder="Ví dụ: NOLA Official" required>
                        <div class="text-danger small mt-1" th:errors="*{shopName}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Logo gian hàng</label>
                        <div th:if="${ownedShop.logoUrl != null}" class="mb-3 text-start">
                            <img th:src="${ownedShop.logoUrl}" alt="Logo hiện tại của gian hàng"
                                 class="rounded border border-clay" style="max-width: 120px; max-height: 120px; object-fit: cover;">
                            <div class="text-muted small mt-1">Logo hiện tại sẽ được giữ nếu bạn không chọn ảnh mới.</div>
                        </div>
                        <input th:field="*{logo}" type="file"
                               class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum"
                               accept="image/jpeg,image/png">
                        <div class="text-muted small mt-1">Không bắt buộc. Dung lượng tối đa 2MB, định dạng JPEG/PNG.</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-uppercase fw-medium text-plum small mb-2">Mô tả gian hàng *</label>
                        <textarea th:field="*{description}" rows="4"
                                  class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum"
                                  placeholder="Giới thiệu ngắn về sản phẩm và thương hiệu của bạn" required></textarea>
                        <div class="text-danger small mt-1" th:errors="*{description}"></div>
                    </div>

                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label text-uppercase fw-medium text-plum small mb-2">Số điện thoại *</label>
                            <input th:field="*{phone}" type="text"
                                   class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum"
                                   placeholder="0900000000" required>
                            <div class="text-danger small mt-1" th:errors="*{phone}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-uppercase fw-medium text-plum small mb-2">Địa chỉ *</label>
                            <input th:field="*{address}" type="text"
                                   class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum"
                                   placeholder="Địa chỉ cửa hàng hoặc kho hàng" required>
                            <div class="text-danger small mt-1" th:errors="*{address}"></div>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-3 mt-5 pt-4 border-top">
                        <a th:href="@{/merchant/shop-status}"
                           class="btn border border-plum text-plum rounded-0 fw-medium px-4 py-2">Quay lại</a>
                        <button type="submit" class="btn bg-burgundy text-white rounded-0 fw-medium px-4 py-2">
                            Gửi lại yêu cầu
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
