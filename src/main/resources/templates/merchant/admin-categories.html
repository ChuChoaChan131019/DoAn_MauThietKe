<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Quản lý danh mục')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="w-100 mx-auto px-3 px-md-4 py-5" style="max-width: 1440px;">
        <div class="row gx-lg-5">
            <aside class="col-12 col-md-3 mb-5 mb-md-0">
                <div class="d-flex flex-column gap-3 sticky-top" style="top: 100px;">
                    <h4 class="text-serif text-plum mb-4">Quản Trị</h4>
                    <a th:href="@{/admin/dashboard}" class="text-muted text-decoration-none pb-2 d-inline-block w-100">
                        <i class="bi bi-speedometer2 me-2"></i>Tổng quan
                    </a>
                    <a th:href="@{/admin/accounts}" class="text-muted text-decoration-none pb-2 d-inline-block w-100">
                        <i class="bi bi-people me-2"></i>Tài khoản
                    </a>
                    <a th:href="@{/admin/shop-requests}" class="text-muted text-decoration-none pb-2 d-inline-block w-100">
                        <i class="bi bi-shop me-2"></i>Duyệt gian hàng
                    </a>
                    <a th:href="@{/admin/shops}" class="text-muted text-decoration-none pb-2 d-inline-block w-100">
                        <i class="bi bi-buildings me-2"></i>Quản lý gian hàng
                    </a>
                    <a th:href="@{/admin/categories}" class="fw-bold text-burgundy text-decoration-none border-bottom border-burgundy pb-2 d-inline-block w-100">
                        <i class="bi bi-tags me-2"></i>Danh mục
                    </a>
                    <a th:href="@{/admin/orders}" class="text-muted text-decoration-none pb-2 d-inline-block w-100">
                        <i class="bi bi-receipt-cutoff me-2"></i>Giám sát đơn hàng
                    </a>
                </div>
            </aside>

            <section class="col-12 col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-4 gap-3">
                    <div>
                        <h2 class="text-serif text-plum m-0">Quản lý danh mục</h2>
                        <p class="text-muted mb-0 mt-2">Danh mục đã ẩn vẫn được giữ lại để bảo toàn sản phẩm cũ.</p>
                    </div>
                </div>

                <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

                <div th:if="${editingCategoryId == null}" class="card border-0 shadow-sm mb-4">
                    <div class="card-body p-4">
                        <h5 class="text-plum mb-3">Thêm danh mục</h5>
                        <form th:action="@{/admin/categories}" th:object="${categoryForm}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="mb-3">
                                <label for="categoryName" class="form-label">Tên danh mục</label>
                                <input id="categoryName" type="text" th:field="*{name}" class="form-control" maxlength="100" required>
                                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-1"></div>
                            </div>
                            <div class="mb-3">
                                <label for="categoryDescription" class="form-label">Mô tả</label>
                                <textarea id="categoryDescription" th:field="*{description}" class="form-control" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn bg-burgundy text-white rounded-0">Lưu danh mục</button>
                        </form>
                    </div>
                </div>

                <div th:if="${editingCategoryId != null}" class="card border-0 shadow-sm mb-4">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="text-plum mb-0">Sửa danh mục</h5>
                            <a th:href="@{/admin/categories}" class="text-muted">Hủy</a>
                        </div>
                        <form th:action="@{/admin/categories/{id}/update(id=${editingCategoryId})}" th:object="${editForm}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="mb-3">
                                <label for="editCategoryName" class="form-label">Tên danh mục</label>
                                <input id="editCategoryName" type="text" th:field="*{name}" class="form-control" maxlength="100" required>
                                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-1"></div>
                            </div>
                            <div class="mb-3">
                                <label for="editCategoryDescription" class="form-label">Mô tả</label>
                                <textarea id="editCategoryDescription" th:field="*{description}" class="form-control" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn bg-burgundy text-white rounded-0">Cập nhật</button>
                        </form>
                    </div>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div th:if="${#lists.isEmpty(categories)}" class="p-4 text-muted">Chưa có danh mục nào.</div>
                        <div th:unless="${#lists.isEmpty(categories)}" class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead>
                                <tr>
                                    <th class="px-4 py-3">Tên danh mục</th>
                                    <th class="py-3">Mô tả</th>
                                    <th class="py-3">Trạng thái</th>
                                    <th class="py-3 text-end px-4">Thao tác</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="category : ${categories}">
                                    <td class="px-4 fw-semibold text-plum" th:text="${category.name}"></td>
                                    <td class="text-muted" th:text="${category.description ?: '—'}"></td>
                                    <td>
                                        <span th:if="${category.active}" class="badge text-bg-success">Đang dùng</span>
                                        <span th:unless="${category.active}" class="badge text-bg-secondary">Đã ẩn</span>
                                    </td>
                                    <td class="text-end px-4">
                                        <a th:href="@{/admin/categories(edit=${category.id})}" class="btn btn-sm btn-outline-secondary rounded-0 me-1">Sửa</a>
                                        <form th:if="${category.active}" th:action="@{/admin/categories/{id}/hide(id=${category.id})}" method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-0"
                                                    onclick="return confirm('Bạn có chắc muốn ẩn danh mục này không?');">Ẩn</button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
