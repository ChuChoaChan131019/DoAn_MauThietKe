<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Đơn mua')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row gx-lg-5">
            <nav class="col-12 col-md-3 mb-5 mb-md-0" aria-label="Tài khoản">
                <h4 class="text-serif text-plum mb-4">Tài khoản</h4>
                <a th:href="@{/account/profile}" class="d-block text-muted mb-3">Hồ sơ cá nhân</a>
                <a th:href="@{/account/orders}" class="d-block fw-bold text-burgundy">Đơn mua</a>
            </nav>

            <div class="col-12 col-md-9">
                <h1 class="text-serif text-plum mb-4">Đơn mua của bạn</h1>
                <div th:if="${cancelSuccess}" class="alert alert-success rounded-0" role="status"
                     th:text="${cancelSuccess}"></div>
                <div th:if="${cancelError}" class="alert alert-danger rounded-0" role="alert"
                     th:text="${cancelError}"></div>

                <div th:if="${#lists.isEmpty(orders)}" class="bg-white border border-clay p-4 text-muted">
                    Bạn chưa có đơn hàng nào.
                </div>

                <div th:each="order : ${orders}" class="bg-white border border-clay p-4 mb-3">
                    <div class="d-flex flex-wrap justify-content-between gap-3 border-bottom pb-3 mb-3">
                        <div>
                            <strong class="text-plum" th:text="${order.orderCode}"></strong>
                            <span class="text-muted small ms-2" th:text="${order.date}"></span>
                            <div class="text-muted small mt-1" th:text="${order.shopName}"></div>
                        </div>
                        <span class="fw-bold text-burgundy" th:text="${order.status}"></span>
                    </div>
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                        <span class="text-plum">
                            Tổng tiền:
                            <strong th:text="${order.totalAmount} + ' ₫'"></strong>
                        </span>
                        <a th:href="@{/account/orders/detail(id=${order.orderCode})}"
                           class="btn border border-plum text-plum rounded-0 px-4">
                            Xem chi tiết
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
