<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Senvia - Lịch sử đơn hàng')}">
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">

        <!-- Back navigation -->
        <div class="mb-4">
            <a th:href="${backUrl}"
               class="text-muted text-decoration-none">

                <i class="bi bi-arrow-left me-2"></i>
                Quay lại danh sách đơn hàng
            </a>
        </div>

        <!-- Page Header -->
        <div class="border-bottom pb-4 mb-5">

            <h1 class="text-serif text-plum mb-3">
                Lịch sử trạng thái đơn hàng
            </h1>

            <div class="text-muted">
                Mã đơn hàng:
                <strong class="text-plum"
                        th:text="${orderCode}">
                </strong>
            </div>
        </div>

        <div class="row justify-content-center">

            <div class="col-12 col-lg-9">

                <div class="bg-white border border-clay p-4 p-md-5">

                    <div class="d-flex align-items-center
                                justify-content-between
                                border-bottom pb-3 mb-4">

                        <h5 class="fw-bold text-plum mb-0">
                            <i class="bi bi-clock-history me-2"></i>
                            Quá trình xử lý
                        </h5>

                        <span class="small text-muted"
                              th:text="${#lists.size(history)} + ' mốc'">
                        </span>
                    </div>

                    <!-- Empty state -->
                    <div th:if="${#lists.isEmpty(history)}"
                         class="text-center text-muted py-5">

                        <i class="bi bi-clock-history fs-2"></i>

                        <p class="mt-3 mb-0">
                            Chưa có lịch sử trạng thái.
                        </p>
                    </div>

                    <!-- Timeline -->
                    <div th:unless="${#lists.isEmpty(history)}"
                         class="ps-3">

                        <div th:each="entry, iter : ${history}"
                             class="position-relative border-start
                                    border-2 border-clay ps-4"
                             th:classappend="${iter.last}
                                    ? ' pb-0' : ' pb-4'">

                            <span class="position-absolute rounded-circle"
                                  th:classappend="${entry.newStatus == 'CANCELLED'}
                                        ? ' bg-danger'
                                        : ' bg-burgundy'"
                                  style="width: 14px;
                                         height: 14px;
                                         top: 2px;
                                         left: -8px;">
                            </span>

                            <h6 class="fw-bold text-plum mb-2"
                                th:text="${entry.statusLabel}">
                            </h6>

                            <p class="text-muted small mb-2">

                                <i class="bi bi-calendar me-1"></i>

                                <span th:text="${entry.displayTime}">
                                </span>
                            </p>

                            <div class="small mb-2"
                                 th:if="${entry.oldStatus != null}">

                                <span th:text="${entry.oldStatus}">
                                </span>

                                <i class="bi bi-arrow-right mx-2"></i>

                                <strong th:text="${entry.newStatus}">
                                </strong>
                            </div>

                            <p class="text-muted small mb-2">

                                Người thực hiện: #

                                <span th:text="${entry.changedBy}">
                                </span>
                            </p>

                            <div th:if="${entry.note != null
                                         and !#strings.isEmpty(entry.note)}"
                                 class="bg-ivory border-start border-3
                                        border-clay p-3 mt-3">

                                <span class="small fw-bold text-plum">
                                    Ghi chú
                                </span>

                                <p class="small text-muted mt-2 mb-0"
                                   style="white-space: pre-wrap;
                                          overflow-wrap: anywhere;"
                                   th:text="${entry.note}">
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <p class="text-muted small mt-3">
                    Lịch sử được lấy từ dữ liệu đơn hàng thực tế.
                    Xác nhận thanh toán không được tính là một lần
                    chuyển trạng thái đơn hàng.
                </p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
