<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Giám sát đơn hàng')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row gx-lg-5">
            <nav class="col-12 col-md-3 mb-5 mb-md-0" aria-label="Quản trị">
                <h4 class="text-serif text-plum mb-4">Quản trị</h4>
                <a th:href="@{/admin/dashboard}" class="d-block text-muted mb-3">Tổng quan</a>
                <a th:href="@{/admin/orders}" class="d-block fw-bold text-burgundy">Giám sát đơn hàng</a>
            </nav>

            <div class="col-12 col-md-9">
                <h1 class="text-serif text-plum mb-4">Giám sát đơn hàng</h1>
                <div th:if="${cancelSuccess}" class="alert alert-success rounded-0" role="status"
                     th:text="${cancelSuccess}"></div>
                <div th:if="${cancelError}" class="alert alert-danger rounded-0" role="alert"
                     th:text="${cancelError}"></div>

                <div th:if="${#lists.isEmpty(orders)}" class="bg-white border border-clay p-4 text-muted">
                    Chưa có đơn hàng nào.
                </div>

                <div th:unless="${#lists.isEmpty(orders)}" class="table-responsive bg-white border border-clay">
                    <table class="table table-hover align-middle mb-0 text-plum">
                        <thead class="bg-ivory">
                            <tr>
                                <th scope="col" class="px-4 py-3">Mã đơn</th>
                                <th scope="col">Gian hàng</th>
                                <th scope="col">Buyer ID</th>
                                <th scope="col">Tổng tiền</th>
                                <th scope="col">Trạng thái</th>
                                <th scope="col" class="text-end px-4">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td class="px-4 py-3">
                                    <strong th:text="${order.orderCode}"></strong>
                                    <div class="small text-muted" th:text="${order.date}"></div>
                                </td>
                                <td th:text="${order.shopName}"></td>
                                <td th:text="${order.buyerId}"></td>
                                <td th:text="${order.totalAmount} + ' ₫'"></td>
                                <td th:text="${order.status}"></td>
                                <td class="text-end px-4">
                                    <div class="d-flex flex-wrap justify-content-end gap-2">
                                        <a th:href="@{/admin/orders/detail(id=${order.orderCode})}"
                                           class="btn btn-sm border border-plum text-plum rounded-0">
                                            Chi tiết
                                        </a>
                                        <a th:href="@{/admin/orders/history(id=${order.orderCode})}"
                                           class="btn btn-sm border border-plum text-plum rounded-0">
                                            Xem lịch sử
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
