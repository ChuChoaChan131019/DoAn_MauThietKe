<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Đánh Giá Sản Phẩm')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <a th:href="@{/products/{id}/reviews(id=${reviewContext.productId})}" class="text-muted text-decoration-none hover-plum transition-colors mb-4 d-inline-block"><i class="bi bi-arrow-left me-2"></i>Xem đánh giá sản phẩm</a>
                
                <h2 class="text-serif text-plum mb-4">Đánh Giá Sản Phẩm</h2>

                <div th:if="${successMessage}" class="alert alert-success rounded-0" role="status" th:text="${successMessage}"></div>
                <div th:if="${infoMessage}" class="alert alert-info rounded-0" role="status" th:text="${infoMessage}"></div>
                <div th:if="${reviewFormError}" class="alert alert-danger rounded-0" role="alert" th:text="${reviewFormError}"></div>
                
                <div class="bg-white p-4 p-md-5 border border-clay shadow-sm">
                    <div class="d-flex gap-3 border-bottom pb-4 mb-4">
                        <img th:if="${reviewContext.productImageUrl != null}" th:src="${reviewContext.productImageUrl}" th:alt="${reviewContext.productName}" class="bg-ivory object-fit-cover" style="width: 80px; height: 80px;">
                        <div>
                            <h6 class="text-plum mb-1" th:text="${reviewContext.productName}">Sản phẩm</h6>
                        </div>
                    </div>

                    <div th:if="${reviewContext.alreadyReviewed}" class="alert alert-info rounded-0 mb-0" role="status">
                        Bạn đã đánh giá sản phẩm này. Mỗi sản phẩm trong đơn chỉ được đánh giá một lần.
                    </div>

                    <form th:unless="${reviewContext.alreadyReviewed}" th:action="@{/account/review}" th:object="${reviewForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" th:field="*{orderItemId}">
                        <input type="hidden" th:field="*{productId}">
                        <div class="mb-4 text-center">
                            <label class="form-label fw-bold text-plum d-block mb-3">Chất lượng sản phẩm</label>
                            <select class="form-select bg-ivory border-clay rounded-0 mx-auto" style="max-width: 220px;" th:field="*{rating}" required>
                                <option value="">Chọn số sao</option>
                                <option th:each="rating : ${#numbers.sequence(1, 5)}" th:value="${rating}" th:text="${rating} + ' sao'"></option>
                            </select>
                            <div class="text-danger small mt-2" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="reviewComment" class="form-label text-uppercase fw-medium text-plum small mb-2">Nhận xét (tùy chọn)</label>
                            <textarea id="reviewComment" th:field="*{comment}" class="form-control bg-ivory border-0 rounded-0 px-4 py-3 shadow-none text-plum" rows="4" placeholder="Hãy chia sẻ cảm nhận của bạn về sản phẩm này..."></textarea>
                        </div>

                        <button type="submit" class="btn bg-burgundy text-white rounded-0 fw-medium text-uppercase px-5 py-3 border-0 w-100 hover-bg-plum transition-colors">Gửi Đánh Giá</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
