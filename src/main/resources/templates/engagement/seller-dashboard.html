<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Kênh Người Bán')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row gx-lg-5">
            <aside class="col-12 col-md-3 mb-5 mb-md-0">
                <div class="d-flex flex-column gap-3 sticky-top" style="top: 100px;">
                    <h4 class="text-serif text-plum mb-4">Kênh Người Bán</h4>
                    <a th:href="@{/seller/dashboard}"
                       class="fw-bold text-burgundy text-decoration-none border-bottom border-burgundy pb-2 d-inline-block w-100">
                        <i class="bi bi-graph-up me-2"></i>Thống kê
                    </a>
                    <a th:href="@{/merchant/products}"
                       class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">
                        <i class="bi bi-box-seam me-2"></i>Quản lý sản phẩm
                    </a>
                    <a th:href="@{/merchant/orders}"
                       class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">
                        <i class="bi bi-receipt me-2"></i>Quản lý đơn hàng
                    </a>
                    <a th:href="@{/merchant/profile}"
                       class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">
                        <i class="bi bi-shop me-2"></i>Thông tin gian hàng
                    </a>
                </div>
            </aside>

            <section class="col-12 col-md-9">
                <h2 class="text-serif text-plum mb-4">Tổng Quan Kinh Doanh</h2>
                <div class="row g-4">
                    <div class="col-12 col-sm-6 col-lg-4">
                        <div class="bg-white p-4 border border-clay h-100">
                            <div class="text-muted small text-uppercase fw-medium mb-2">Tổng số sản phẩm</div>
                            <div class="fs-2 fw-bold text-plum" th:text="${productCount}">0</div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-4">
                        <div class="bg-white p-4 border border-clay h-100">
                            <div class="text-muted small text-uppercase fw-medium mb-2">Tổng số đơn hàng</div>
                            <div class="fs-2 fw-bold text-plum" th:text="${totalOrders}">0</div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-4">
                        <div class="bg-white p-4 border border-clay h-100">
                            <div class="text-muted small text-uppercase fw-medium mb-2">Doanh thu đơn hoàn tất</div>
                            <div class="fs-4 fw-bold text-success"
                                 th:text="${#numbers.formatDecimal(completedRevenue, 0, 'COMMA', 2, 'POINT')} + '₫'">0₫</div>
                        </div>
                    </div>
                </div>

                <section class="mt-5">
                    <h5 class="fw-bold text-plum mb-3">Đơn hàng theo trạng thái</h5>
                    <div class="table-responsive bg-white border border-clay">
                        <table class="table table-borderless table-hover align-middle mb-0 text-plum">
                            <thead class="border-bottom">
                                <tr class="text-muted small text-uppercase">
                                    <th class="px-4 py-3 fw-medium">Trạng thái</th>
                                    <th class="px-4 py-3 fw-medium text-end">Số đơn</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="entry : ${ordersByStatus}" class="border-bottom">
                                    <td class="px-4 py-3" th:text="${orderStatusLabels[entry.key]}">Trạng thái</td>
                                    <td class="px-4 py-3 fw-bold text-end" th:text="${entry.value}">0</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
