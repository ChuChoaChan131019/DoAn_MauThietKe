<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Thông Báo')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row gx-lg-5">
            <aside class="col-12 col-md-3 mb-5 mb-md-0">
                <div class="d-flex flex-column gap-3 sticky-top" style="top: 100px;">
                    <h4 class="text-serif text-plum mb-4">Tài Khoản</h4>
                    <a th:href="@{/account/profile}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Hồ sơ cá nhân</a>
                    <a th:href="@{/account/change-password}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Đổi mật khẩu</a>
                    <a th:href="@{/account/orders}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Đơn mua</a>
                    <a th:href="@{/account/wishlist}" class="text-muted hover-plum text-decoration-none transition-colors pb-2 d-inline-block w-100">Sản phẩm yêu thích</a>
                    <a th:href="@{/account/notifications}" class="fw-bold text-burgundy text-decoration-none border-bottom border-burgundy pb-2 d-inline-block w-100 d-flex justify-content-between align-items-center" aria-current="page">
                        Thông báo
                        <span th:if="${unreadNotifications > 0}" th:text="${unreadNotifications}" class="badge bg-burgundy rounded-pill" aria-label="Số thông báo chưa đọc">0</span>
                    </a>
                </div>
            </aside>
            <section class="col-12 col-md-9" aria-labelledby="notification-title">
                <div class="d-flex flex-column flex-sm-row gap-3 justify-content-between align-items-sm-end mb-4 border-bottom pb-3">
                    <div>
                        <h2 id="notification-title" class="text-serif text-plum m-0">Thông Báo Của Bạn</h2>
                        <p class="text-muted small mb-0 mt-2" th:text="|${notificationPage.totalItems} thông báo, ${unreadNotifications} chưa đọc|">0 thông báo</p>
                    </div>
                    <form th:if="${unreadNotifications > 0}" th:action="@{/account/notifications/read-all}" method="post">
                        <input type="hidden" name="page" th:value="${notificationPage.currentPage}">
                        <button type="submit" class="btn btn-sm border border-plum text-plum rounded-0 px-3">Đánh dấu tất cả đã đọc</button>
                    </form>
                </div>
                <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
                <div th:if="${#lists.isEmpty(notifications)}" class="bg-ivory border border-clay p-5 text-center">
                    <i class="bi bi-bell fs-1 text-muted" aria-hidden="true"></i>
                    <h3 class="h5 text-plum mt-3">Chưa có thông báo</h3>
                    <p class="text-muted mb-0">Các cập nhật quan trọng về gian hàng và đơn hàng sẽ xuất hiện tại đây.</p>
                </div>
                <div th:unless="${#lists.isEmpty(notifications)}" class="d-flex flex-column gap-3">
                    <article th:each="item : ${notifications}" th:classappend="${item.read} ? 'bg-ivory' : 'bg-white border-burgundy'" class="border border-clay p-4 position-relative">
                        <span th:unless="${item.read}" class="position-absolute bg-burgundy rounded-circle" style="width: 8px; height: 8px; top: 1.5rem; left: 1rem;" aria-hidden="true"></span>
                        <div class="ms-3">
                            <div class="d-flex flex-column flex-sm-row gap-2 justify-content-between align-items-sm-start mb-2">
                                <div>
                                    <span th:text="${item.read} ? 'Đã đọc' : 'Chưa đọc'" th:classappend="${item.read} ? 'text-bg-secondary' : 'text-bg-danger'" class="badge mb-2">Trạng thái</span>
                                    <h3 th:text="${item.title}" th:classappend="${item.read} ? 'fw-medium opacity-75' : 'fw-bold'" class="h6 text-plum m-0">Tiêu đề thông báo</h3>
                                </div>
                                <time th:datetime="${item.createdAt}" th:text="${item.createdAt}" class="text-muted small text-nowrap">Thời gian</time>
                            </div>
                            <p th:text="${item.content}" th:classappend="${item.read} ? 'opacity-75' : ''" class="text-muted mb-3">Nội dung thông báo</p>
                            <form th:unless="${item.read}" th:action="@{/account/notifications/{id}/read(id=${item.id})}" method="post">
                                <input type="hidden" name="page" th:value="${notificationPage.currentPage}">
                                <button type="submit" class="btn btn-sm border border-plum text-plum rounded-0 px-3">Đánh dấu đã đọc</button>
                            </form>
                        </div>
                    </article>
                </div>
                <nav th:if="${notificationPage.totalPages > 1}" class="mt-5" aria-label="Phân trang thông báo">
                    <ul class="pagination justify-content-center border-0 gap-2">
                        <li th:classappend="${!notificationPage.hasPrevious()} ? 'disabled'" class="page-item">
                            <a th:href="@{/account/notifications(page=${notificationPage.currentPage - 1})}" class="page-link border-0 text-muted shadow-none bg-transparent">&larr; Trước</a>
                        </li>
                        <li th:each="pageNumber : ${#numbers.sequence(1, notificationPage.totalPages)}" th:classappend="${pageNumber == notificationPage.currentPage} ? 'active'" class="page-item">
                            <a th:href="@{/account/notifications(page=${pageNumber})}" th:text="${pageNumber}" th:classappend="${pageNumber == notificationPage.currentPage} ? 'bg-plum text-white' : 'text-plum bg-transparent'" class="page-link border-0 rounded-circle shadow-none d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">1</a>
                        </li>
                        <li th:classappend="${!notificationPage.hasNext()} ? 'disabled'" class="page-item">
                            <a th:href="@{/account/notifications(page=${notificationPage.currentPage + 1})}" class="page-link border-0 text-plum shadow-none bg-transparent">Sau &rarr;</a>
                        </li>
                    </ul>
                </nav>
            </section>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
