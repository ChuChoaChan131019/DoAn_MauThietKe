<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Senvia - Thống kê gian hàng')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="w-100 mx-auto px-3 px-md-4 py-5 max-w-1440">
        <div class="row gx-lg-5">
            <nav class="col-12 col-md-3 mb-5 mb-md-0" aria-label="Kênh người bán">
                <h4 class="text-serif text-plum mb-4" th:text="${shop.shopName}">Gian hàng</h4>
                <a th:href="@{/merchant/dashboard}" class="d-block fw-bold text-burgundy mb-3">Thống kê</a>
                <a th:href="@{/merchant/products}" class="d-block text-muted mb-3">Quản lý sản phẩm</a>
                <a th:href="@{/merchant/orders}" class="d-block text-muted mb-3">Quản lý đơn hàng</a>
            </nav>

            <section class="col-12 col-md-9">
                <h1 class="text-serif text-plum mb-2">Tổng quan kinh doanh</h1>
                <p class="text-muted mb-4" th:text="${shop.shopApproved ? 'Gian hàng đang hoạt động' : 'Gian hàng chưa được duyệt hoặc đang tạm khóa'}"></p>

                <div class="row g-3 mb-5">
                    <div class="col-12 col-sm-6 col-lg-4">
                        <div class="bg-white border border-clay p-4 h-100">
                            <div class="text-muted small text-uppercase mb-2">Tổng sản phẩm</div>
                            <div class="fs-2 fw-bold text-plum" th:text="${productCount}">0</div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-4">
                        <div class="bg-white border border-clay p-4 h-100">
                            <div class="text-muted small text-uppercase mb-2">Tổng đơn hàng</div>
                            <div class="fs-2 fw-bold text-plum" th:text="${orderStatistics.totalOrders}">0</div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-lg-4">
                        <div class="bg-white border border-clay p-4 h-100">
                            <div class="text-muted small text-uppercase mb-2">Doanh thu đơn hoàn thành</div>
                            <div class="fs-4 fw-bold text-success"
                                 th:text="${#numbers.formatDecimal(orderStatistics.completedRevenue, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</div>
                        </div>
                    </div>
                </div>

                <h2 class="h4 text-plum mb-3">Đơn hàng theo trạng thái</h2>
                <div class="table-responsive bg-white border border-clay">
                    <table class="table align-middle mb-0">
                        <thead class="bg-ivory">
                            <tr><th class="px-4 py-3">Trạng thái</th><th class="px-4 py-3 text-end">Số đơn</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="entry : ${orderStatistics.ordersByStatus}">
                                <td class="px-4 py-3" th:text="${entry.key}">PENDING</td>
                                <td class="px-4 py-3 text-end" th:text="${entry.value}">0</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
