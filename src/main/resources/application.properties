spring.application.name=doangiuaky
server.port=8081
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.identity.bootstrap-admin.email=${INITIAL_ADMIN_EMAIL:}
app.identity.bootstrap-admin.password=${INITIAL_ADMIN_PASSWORD:}
app.identity.bootstrap-admin.full-name=${INITIAL_ADMIN_FULL_NAME:Platform Administrator}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=11MB
